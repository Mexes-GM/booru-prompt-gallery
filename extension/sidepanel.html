<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booru Prompt Gallery Sidebar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    /* @theme-sync:start — generado por scripts/build-theme.mjs, no editar a mano.
       Copia en hex de los tokens de lib/theme/palette.mjs. Orden de resolución:
         1. :root → oscuro por defecto (coincide con la app en un SO oscuro)
         2. prefers-color-scheme: light → claro como primer pintado
         3. :root[data-theme] → elección explícita que envía la app (THEME_CHANGE) */
    :root { --w-bg: #1E2731; --w-fg: #E4ECF4; --w-bar-bg: #26303B; --w-border: #3E4954; --w-muted-fg: #AEB9C4; --w-btn-bg: #323C46; --w-btn-fg: #E4ECF4; --w-btn-hover-bg: #3E4954; --w-btn-hover-fg: #E4ECF4; --w-accent: #579F68; --w-accent-border: #6FB880; --w-accent-fg: #0F171F; }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) { --w-bg: #E9EFF6; --w-fg: #121B26; --w-bar-bg: #D7DFE7; --w-border: #BEC9D4; --w-muted-fg: #4F5964; --w-btn-bg: #D7DFE7; --w-btn-fg: #192029; --w-btn-hover-bg: #BEC9D4; --w-btn-hover-fg: #121B26; --w-accent: #154222; --w-accent-border: #2C5837; --w-accent-fg: #FFFFFF; }
    }
    :root[data-theme="dark"] { --w-bg: #1E2731; --w-fg: #E4ECF4; --w-bar-bg: #26303B; --w-border: #3E4954; --w-muted-fg: #AEB9C4; --w-btn-bg: #323C46; --w-btn-fg: #E4ECF4; --w-btn-hover-bg: #3E4954; --w-btn-hover-fg: #E4ECF4; --w-accent: #579F68; --w-accent-border: #6FB880; --w-accent-fg: #0F171F; }
    :root[data-theme="light"] { --w-bg: #E9EFF6; --w-fg: #121B26; --w-bar-bg: #D7DFE7; --w-border: #BEC9D4; --w-muted-fg: #4F5964; --w-btn-bg: #D7DFE7; --w-btn-fg: #192029; --w-btn-hover-bg: #BEC9D4; --w-btn-hover-fg: #121B26; --w-accent: #154222; --w-accent-border: #2C5837; --w-accent-fg: #FFFFFF; }
    /* @theme-sync:end */

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--w-bg);
      color: var(--w-fg);
      /* Smooth the wrapper recolor when the app reports a theme change. */
      transition: background-color 150ms cubic-bezier(0.4, 0, 0.2, 1),
                  color 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* ── Dev/Prod Switcher Bar (dev-only; hidden for end users) ────────────── */
    .config-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--w-bar-bg);
      border-bottom: 1px solid var(--w-border);
      padding: 4px 10px;
      font-size: 10px;
      height: 28px;
      flex-shrink: 0;
    }
    .config-bar[hidden] {
      display: none;
    }
    .config-bar span {
      font-weight: 500;
      color: var(--w-muted-fg);
    }
    .btn-group {
      display: flex;
      gap: 5px;
    }
    .btn {
      background-color: var(--w-btn-bg);
      border: 1px solid var(--w-border);
      color: var(--w-btn-fg);
      padding: 2px 6px;
      border-radius: 6px; /* match app radius scale (sm) */
      cursor: pointer;
      font-size: 9px;
      transition: all 0.2s;
    }
    .btn:hover {
      background-color: var(--w-btn-hover-bg);
      color: var(--w-btn-hover-fg);
    }
    .btn.active {
      background-color: var(--w-accent);
      border-color: var(--w-accent-border);
      color: var(--w-accent-fg);
      font-weight: 600;
    }

    /* ── App iframe ────────────────────────────────────────────────────────── */
    .frame-wrap {
      position: relative;
      flex: 1;
      min-height: 0; /* allow flex shrink */
      display: flex;
    }
    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background-color: transparent;
    }

    /* ── Boot screen (shown until the app reports POCKET_READY) ─────────────── */
    .boot {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      background-color: var(--w-bg);
      color: var(--w-muted-fg);
      font-size: 12px;
      opacity: 1;
      transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .boot[data-state="hidden"] {
      opacity: 0;
      pointer-events: none;
    }
    .boot-title {
      color: var(--w-fg);
      font-size: 13px;
      font-weight: 600;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--w-border);
      border-top-color: var(--w-accent);
      animation: spin 800ms linear infinite;
    }
    .boot[data-state="error"] .spinner { display: none; }
    .boot:not([data-state="error"]) .boot-error { display: none; }
    .boot-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 260px;
      line-height: 1.45;
    }
    .boot-retry {
      background-color: var(--w-accent);
      border: 1px solid var(--w-accent-border);
      color: var(--w-accent-fg);
      font-weight: 600;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .boot-retry:focus-visible { outline: 2px solid var(--w-accent-border); outline-offset: 2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2400ms; }
      .boot { transition: none; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Dev/Prod environment switcher. Hidden for end users; revealed by
         sidepanel/01-env.js only when localStorage "booru_sidebar_devmode" === "1". -->
    <div id="config-bar" class="config-bar" hidden>
      <span>Environment:</span>
      <div class="btn-group">
        <button id="btn-local" class="btn active" data-url="http://localhost:3000/extension">Local (Dev)</button>
        <button id="btn-prod" class="btn" data-url="https://booru-prompt-gallery.vercel.app/extension">Production</button>
      </div>
    </div>

    <!-- The actual hosted app iframe. sidepanel/15-main.js loads production (with
         failover to the secondary host) or localhost when dev mode is enabled. The queue / target UI is
         rendered inside this React app, not by the host page.

         allow="clipboard-write": Chrome/Chromium honors the Permissions
         Policy `clipboard-write` directive on this attribute — without it,
         navigator.clipboard.writeText() calls inside the iframe (the app's
         copy-prompt buttons) are blocked because Chrome does NOT auto-grant
         clipboard access to iframes. Firefox does not implement this
         directive at all (Gecko doesn't recognize clipboard-read/-write as
         Permissions Policy features) and relies purely on transient user
         activation instead — every clipboard.writeText() call in the app is
         already inside a click handler, so Firefox needs no equivalent here.
         The attribute is a harmless no-op on Firefox, so one shared
         sidepanel.html serves both browsers without a build-time split. -->
    <div class="frame-wrap">
      <!-- No src here: sidepanel/15-main.js picks the host (primary / fallback / dev)
           so a failover never double-loads the primary first. -->
      <iframe id="app-frame" title="Booru Prompt Gallery" allow="clipboard-write"></iframe>

      <!-- Boot screen: covers the iframe until the app posts POCKET_READY.
           If the primary host doesn't answer, sidepanel/01-env.js fails over to the
           secondary host; if neither loads, it shows the error + Retry. -->
      <div id="boot" class="boot" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <span id="boot-label">Loading Booru Prompt Gallery…</span>
        <div class="boot-error">
          <span class="boot-title">Couldn't reach Booru Prompt Gallery</span>
          <span>Check your connection. The app may also be temporarily down.</span>
          <button id="boot-retry" class="boot-retry" type="button">Retry</button>
        </div>
      </div>
    </div>

  </div>
  <!-- Host logic, split by concern. Classic scripts sharing one global scope;
       order matters (see the header of each file). -->
  <script src="sidepanel/01-env.js"></script>
  <script src="sidepanel/02-queue-state.js"></script>
  <script src="sidepanel/03-keepalive.js"></script>
  <script src="sidepanel/04-site-profiles.js"></script>
  <script src="sidepanel/05-host-bridge.js"></script>
  <script src="sidepanel/06-locator.js"></script>
  <script src="sidepanel/07-targeting.js"></script>
  <script src="sidepanel/08-queue-wait.js"></script>
  <script src="sidepanel/09-inject.js"></script>
  <script src="sidepanel/10-slots.js"></script>
  <script src="sidepanel/11-ledger.js"></script>
  <script src="sidepanel/12-autodl.js"></script>
  <script src="sidepanel/13-process-queue.js"></script>
  <script src="sidepanel/14-enqueue.js"></script>
  <script src="sidepanel/15-main.js"></script>
</body>
</html>
