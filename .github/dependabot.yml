# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Kept quiet on purpose: one monthly run per ecosystem, with every update folded
# into a few grouped PRs (minor/patch together, majors together) instead of one
# PR per package. Security fixes are grouped the same way and still open as soon
# as an advisory is published.
version: 2
updates:
  # Main Next.js app (repo root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      app-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      app-major:
        applies-to: version-updates
        update-types:
          - "major"
      app-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # TypeScript 7 ships without the JavaScript compiler API that
      # typescript-eslint (via eslint-config-next) and ts-node (the test runner)
      # load, so lint and `npm test` can't start on it. Remove this once both
      # support TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  # Cloudflare Worker (image proxy)
  - package-ecosystem: "npm"
    directory: "/workers/booru-image-proxy"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      worker-all:
        applies-to: version-updates
        patterns:
          - "*"
      worker-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "worker"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions-all:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
